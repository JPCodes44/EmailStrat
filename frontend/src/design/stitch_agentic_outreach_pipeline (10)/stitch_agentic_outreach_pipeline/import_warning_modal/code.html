<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-overlay {
            backdrop-filter: blur(8px);
            background-color: rgba(25, 28, 30, 0.4);
        }
        .animate-pop-in {
            animation: pop-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes pop-in {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>

<body class="bg-background font-body-md text-on-background min-h-screen flex items-center justify-center p-gutter">
<!-- Modal Background Overlay -->
<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
<!-- Warning Modal Container -->
<div class="relative w-full max-w-[440px] bg-error-container rounded-xl overflow-hidden shadow-2xl animate-pop-in border border-outline-variant/30">
<!-- 5px Amber Top Accent Strip -->
<div class="h-[5px] w-full bg-amber-500"></div>
<!-- Modal Content Padding (32px) -->
<div class="p-8 flex flex-col items-center text-center">
<!-- Warning Icon -->
<div class="mb-6 flex items-center justify-center w-14 h-14 rounded-full bg-on-error-container/10">
<span class="material-symbols-outlined text-[32px] text-on-error-container" data-icon="content_copy">content_copy</span>
</div>
<!-- Headline -->
<h2 class="font-headline-sm text-headline-sm text-on-error-container mb-3">
                    Already in Your Pipeline
                </h2>
<!-- Body Text -->
<p class="font-body-md text-body-md text-on-error-container/80 mb-8 max-w-[320px]">
                    All 5 selected companies are already in your pipeline — nothing new was added.
                </p>
<!-- Footer Actions -->
<div class="w-full flex flex-col gap-3">
<button class="w-full py-3 px-6 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all duration-200 shadow-sm" id="closeModal">
                        Got it
                    </button>
<!-- Optional secondary action for richer UI feel -->
<button class="w-full py-2 px-6 text-on-error-container/60 font-label-md text-label-md rounded-lg hover:bg-on-error-container/5 transition-colors">
                        View Pipeline
                    </button>
</div>
</div>
<!-- Background subtle pattern for "clinical" texture -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] overflow-hidden">
<div class="absolute -right-4 -top-4">
<span class="material-symbols-outlined text-[120px]" data-icon="business">business</span>
</div>
</div>
</div>
</div>
<!-- Background Content Simulation (Dashboard Context) -->
<div class="fixed inset-0 -z-10 overflow-hidden blur-sm select-none opacity-40">
<div class="max-w-[1440px] mx-auto p-gutter grid grid-cols-12 gap-gutter">
<!-- Sidebar Simulation -->

<div class="h-8 bg-outline-variant rounded-lg w-3/4"></div>

</div>

<script>
        // Simple Micro-interaction for closing the modal
        document.getElementById('closeModal').addEventListener('click', function() {
            const modal = document.querySelector('.modal-overlay');
            modal.style.transition = 'opacity 0.2s ease-out';
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        });

        // Background click to close for better UX in demo
        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                document.getElementById('closeModal').click();
            }
        });
    </script>
