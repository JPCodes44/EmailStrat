<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-blur-backdrop {
            backdrop-filter: blur(8px);
            background-color: rgba(25, 28, 30, 0.4);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#0053db",
                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-surface": "#191c1e",
                    "primary-container": "#2563eb",
                    "on-error": "#ffffff",
                    "outline": "#737686",
                    "on-background": "#191c1e",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary-fixed": "#002113",
                    "secondary": "#505f76",
                    "surface-dim": "#d8dadc",
                    "outline-variant": "#c3c6d7",
                    "primary-fixed": "#dbe1ff",
                    "on-primary-fixed": "#00174b",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-surface-variant": "#434655",
                    "surface-bright": "#f7f9fb",
                    "primary": "#004ac6",
                    "secondary-fixed": "#d3e4fe",
                    "error": "#ba1a1a",
                    "surface-variant": "#e0e3e5",
                    "background": "#f7f9fb",
                    "inverse-primary": "#b4c5ff",
                    "surface": "#f7f9fb",
                    "primary-fixed-dim": "#b4c5ff",
                    "inverse-surface": "#2d3133",
                    "inverse-on-surface": "#eff1f3",
                    "surface-container-high": "#e6e8ea",
                    "on-primary-container": "#eeefff",
                    "tertiary-fixed": "#6ffbbe",
                    "surface-container-highest": "#e0e3e5",
                    "surface-container": "#eceef0",
                    "on-secondary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#38485d",
                    "on-secondary-container": "#54647a",
                    "secondary-container": "#d0e1fb",
                    "on-secondary-fixed": "#0b1c30",
                    "on-tertiary-container": "#bdffdb",
                    "tertiary-container": "#007d55",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-primary-fixed-variant": "#003ea8",
                    "tertiary-fixed-dim": "#4edea3",
                    "tertiary": "#006242"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "inset-squish": "8px 12px",
                    "gutter": "16px",
                    "stack-md": "16px",
                    "unit": "4px",
                    "stack-sm": "8px",
                    "inset-equal": "12px",
                    "container-margin": "24px"
            },
            "fontFamily": {
                    "headline-sm": ["Inter"],
                    "code-sm": ["jetbrainsMono"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "code-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-hidden">
<!-- Modal Container (Simulating an active state on a dashboard) -->
<div class="relative min-h-screen w-full flex items-center justify-center p-gutter bg-background">
<!-- Background Mock Content (Blurred for focus) -->
<div class="absolute inset-0 z-0 p-8 grid grid-cols-12 gap-6 opacity-40 grayscale pointer-events-none">
<div class="col-span-3 bg-white h-full border border-outline-variant rounded-lg"></div>
<div class="col-span-9 flex flex-col gap-6">
<div class="h-16 bg-white border border-outline-variant rounded-lg w-full"></div>
<div class="grid grid-cols-3 gap-4">
<div class="h-32 bg-white border border-outline-variant rounded-lg"></div>
<div class="h-32 bg-white border border-outline-variant rounded-lg"></div>
<div class="h-32 bg-white border border-outline-variant rounded-lg"></div>
</div>
<div class="flex-grow bg-white border border-outline-variant rounded-lg w-full"></div>
</div>
</div>
<!-- The Modal Backdrop -->
<div class="fixed inset-0 z-40 modal-blur-backdrop flex items-center justify-center transition-opacity duration-300" id="modal-backdrop">
<!-- Modal Content -->
<div class="w-[440px] bg-surface-container-lowest rounded-xl shadow-2xl overflow-hidden flex flex-col animate-in fade-in zoom-in duration-200">
<!-- 5px top accent strip in red -->
<div class="h-[5px] w-full bg-error"></div>
<div class="p-8 flex flex-col items-center text-center">
<!-- Icon Section -->
<div class="mb-6 w-14 h-14 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container text-[32px]" data-icon="error">error</span>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-unit mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface">Generation Failed</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px]">
                            The AI engine encountered an unexpected timeout while processing your request. Please check your settings and try again.
                        </p>
</div>
<!-- Actions -->
<div class="flex items-center gap-stack-sm w-full">
<button class="flex-1 h-10 border border-outline-variant text-on-surface-variant font-label-md text-label-md rounded px-4 hover:bg-surface-container-high transition-colors active:scale-[0.98] duration-150">
                            Dismiss
                        </button>
<button class="flex-1 h-10 bg-primary text-on-primary font-label-md text-label-md rounded px-4 shadow-sm hover:opacity-90 transition-all active:scale-[0.98] duration-150">
                            Retry
                        </button>
</div>
</div>
<!-- Subtle footer with technical code for clinical B2B feel -->
<div class="px-8 py-4 bg-surface-container-low border-t border-outline-variant flex justify-between items-center">
<span class="font-code-sm text-code-sm text-outline">ERROR_CODE: TIMEOUT_0x442</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="help_outline">help_outline</span>
<span class="font-label-md text-label-md text-outline">Support Docs</span>
</div>
</div>
</div>
</div>
</div>
<script>
        // Simple micro-interaction for the "Dismiss" and "Retry" buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const backdrop = document.getElementById('modal-backdrop');
                backdrop.classList.add('opacity-0');
                backdrop.style.pointerEvents = 'none';
                setTimeout(() => {
                    // In a real app, this would remove the component from DOM
                    console.log('Modal dismissed/Actioned');
                }, 300);
            });
        });

        // Atmospheric parallax on backdrop (subtle movement)
        document.addEventListener('mousemove', (e) => {
            const amount = 5;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            const modal = document.querySelector('.animate-in');
            if (modal) {
                modal.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body></html>
