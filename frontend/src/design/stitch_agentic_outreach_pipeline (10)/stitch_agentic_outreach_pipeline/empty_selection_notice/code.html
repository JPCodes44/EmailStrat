<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-blur-bg p-gutter transition-opacity duration-300" id="modal-overlay">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative w-full max-w-[440px] bg-surface-container-lowest rounded-xl overflow-hidden shadow-xl dark:shadow-2xl shadow-on-surface/10 transform transition-all duration-300 scale-100 opacity-100" role="dialog">
<!-- Top Accent Strip -->
<div class="absolute top-0 left-0 right-0 h-[5px] bg-primary"></div>
<!-- Modal Content -->
<div class="p-8 flex flex-col items-center text-center">
<!-- Icon Container -->
<div class="mb-6 flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high text-primary">
<span class="material-symbols-outlined text-[32px]" data-icon="info">info</span>
</div>
<!-- Typography -->
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-2" id="modal-title">

                </h3>

                    Select at least one company first to proceed with this action.
                </p>
<!-- Action Button -->
<button class="w-full py-2.5 px-6 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-surface-tint active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" onclick="closeModal()">
                    OK
                </button>
</div>
</div>
</div>
<script>
        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const modal = overlay.querySelector('div[role="dialog"]');
            
            // Outward transition
            modal.classList.remove('scale-100', 'opacity-100');
            modal.classList.add('scale-95', 'opacity-0');
            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        }

        // Lightweight entrance animation
        window.onload = () => {
            const overlay = document.getElementById('modal-overlay');
            const modal = overlay.querySelector('div[role="dialog"]');
            
            // Initial state
            overlay.classList.add('opacity-0');
            modal.classList.add('scale-95', 'opacity-0');
            
            // Trigger animation
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-95', 'opacity-0');
                modal.classList.add('scale-100', 'opacity-100');
            });
        }
    </script>
