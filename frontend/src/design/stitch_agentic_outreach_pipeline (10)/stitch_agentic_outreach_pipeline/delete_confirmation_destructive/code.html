<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delete Confirmation | Outreach OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-overlay {
            background: rgba(25, 28, 30, 0.4);
            backdrop-filter: blur(8px);
        }
        .modal-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#0053db",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-surface": "#191c1e",
                        "primary-container": "#2563eb",
                        "on-error": "#ffffff",
                        "outline": "#737686",
                        "on-background": "#191c1e",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed": "#002113",
                        "secondary": "#505f76",
                        "surface-dim": "#d8dadc",
                        "outline-variant": "#c3c6d7",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface-variant": "#434655",
                        "surface-bright": "#f7f9fb",
                        "primary": "#004ac6",
                        "secondary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e3e5",
                        "background": "#f7f9fb",
                        "inverse-primary": "#b4c5ff",
                        "surface": "#f7f9fb",
                        "primary-fixed-dim": "#b4c5ff",
                        "inverse-surface": "#2d3133",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-container": "#eeefff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-container": "#54647a",
                        "secondary-container": "#d0e1fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary-container": "#bdffdb",
                        "tertiary-container": "#007d55",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary": "#006242"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inset-squish": "8px 12px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "inset-equal": "12px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "code-sm": ["jetbrainsMono"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],

                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center p-gutter">
<!-- Mock Background Content to demonstrate the overlay effect -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-20">
<div class="p-10 grid grid-cols-3 gap-6">
<div class="h-40 bg-surface-container-high rounded-xl border border-outline-variant"></div>
<div class="h-40 bg-surface-container-high rounded-xl border border-outline-variant"></div>
<div class="h-40 bg-surface-container-high rounded-xl border border-outline-variant"></div>
<div class="h-40 bg-surface-container-high rounded-xl border border-outline-variant"></div>
<div class="h-40 bg-surface-container-high rounded-xl border border-outline-variant"></div>
<div class="h-40 bg-surface-container-high rounded-xl border border-outline-variant"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 transition-opacity duration-300" id="modal-container">
<div class="absolute inset-0 glass-overlay"></div>
<!-- Modal Dialog -->
<div aria-describedby="modal-body" aria-labelledby="modal-headline" aria-modal="true" class="relative w-full max-w-[440px] bg-surface-container-lowest dark:bg-surface-container rounded-xl modal-shadow border border-outline-variant p-[32px] flex flex-col items-center text-center transform transition-all duration-300 scale-100 animate-in fade-in zoom-in duration-300" role="alertdialog">
<!-- Icon Container -->
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-error text-[24px]" data-icon="delete">delete</span>
</div>
<!-- Content -->
<div class="flex flex-col gap-2 mb-8">
<h2 class="font-headline-sm text-headline-sm text-on-surface" id="modal-headline">
                    Delete 3 companies?
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px]" id="modal-body">
                    This removes the selected companies and any generated email templates &amp; resumes. This can't be undone.
                </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-3 w-full">
<!-- Secondary Cancel Button -->
<button class="flex-1 px-6 py-2.5 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-secondary-fixed-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors duration-200 order-2 sm:order-1" onclick="closeModal()">
                    Cancel
                </button>
<!-- Primary Danger Delete Button -->
<button class="flex-1 px-6 py-2.5 rounded-lg bg-error text-on-error font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all duration-150 shadow-sm order-1 sm:order-2" onclick="handleDelete()">
                    Delete
                </button>
</div>
<!-- Subtle Micro-interaction script -->
<script>
                function closeModal() {
                    const modal = document.getElementById('modal-container');
                    modal.classList.add('opacity-0', 'pointer-events-none');
                    // In a real app, you would remove from DOM or change state
                }

                function handleDelete() {
                    const btn = event.currentTarget;
                    const originalText = btn.innerText;
                    btn.disabled = true;
                    btn.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Deleting...</span>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        closeModal();
                        // Reset button for demo purposes
                        setTimeout(() => {
                            btn.disabled = false;
                            btn.innerText = originalText;
                            document.getElementById('modal-container').classList.remove('opacity-0', 'pointer-events-none');
                        }, 1000);
                    }, 1500);
                }

                // Close on Esc key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeModal();
                });
            </script>
</div>
</div>
</body></html>
